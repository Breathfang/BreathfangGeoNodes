name = "DragonGraph's Toolset Pack Loader"
tagline = "Loads DragonGraph's Toolset Pack into Blender's Asset Browser"
maintainer = "Breathfang <https://github.com/Breathfang/>"
type = "add-on"
website = "https://github.com/Breathfang/BreathfangGeoNodes"
